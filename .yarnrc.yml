
catalogs:
  backstage-backend-common:
    "@backstage/backend-common": "^0.25.0"
  backstage-plugin-scaffolder-node:
    "@backstage/plugin-scaffolder-node": "^0.13.6"
  eventsource-parser:
    "eventsource-parser": "^2.0.1"
  i18next:
    "i18next": "26.3.6"
  knex:
    "knex": "^3.3.0"
  langchain-core:
    "@langchain/core": "^1.2.6"
  material-ui-core:
    "@material-ui/core": "^4.12.4"
  material-ui-icons:
    "@material-ui/icons": "^4.11.3"
  node-types:
    "@types/node": "^22.20.3"
  playwright-test:
    "@playwright/test": "^1.63.0"
  react:
    "react": "^18.3.1"
  react-dom:
    "react-dom": "^18.3.1"
  react-router:
    "react-router": "^6.30.6"
  react-router-dom:
    "react-router-dom": "^6.30.6"
  storybook:
    "storybook": "^10.5.10"
  typescript:
    "typescript": "^6.0.3"
  testing-library-jest-dom:
    "@testing-library/jest-dom": "^6.10.0"
  testing-library-react:
    "@testing-library/react": "^16.3.2"
  testing-library-user-event:
    "@testing-library/user-event": "^14.6.6"
  vitest:
    "vitest": "^4.1.11"
  yaml:
    "yaml": "2.9.0"
  zod:
    "zod": "^4.5.4"


approvedGitRepositories:
  - "**"

enableScripts: true

# The Backstage CLI emits the module federation runtime shared dependencies module
# into packages/app/node_modules, which the PnP resolver refuses to resolve.
nodeLinker: node-modules

logFilters:
  - code: YN0002
    level: discard
    text: doesn't provide jest
  - code: YN0060
    level: discard
    text: "@material-ui/core and other dependencies request"
  - code: YN0086
    level: discard
    text: Some peer dependencies are incorrectly met

npmMinimalAgeGate: 0

packageExtensions:
  "@backstage/cli-module-build@*":
    dependencies:
      esbuild: ^0.28.1
  "@backstage/cli-module-test-jest@*":
    dependencies:
      "@jest/environment-jsdom-abstract": "*"
      jest-environment-node: "*"
      jest-runtime: "*"
      jsdom: "*"
      yaml: "*"
  "@backstage/plugin-app@*":
    dependencies:
      "@backstage/config": ^1.3.8
      "@backstage/core-app-api": ^1.20.2
      i18next: ^26.3.6
      lodash: ^4.18.1
      prop-types: ^15.8.1
      use-sync-external-store: ^1.5.0
  "@backstage/plugin-catalog-react@*":
    dependencies:
      "@emotion/react": ^11.14.0
      "@emotion/styled": ^11.14.1
      "@mui/material": ^7.3.11
  "@backstage/plugin-permission-react@*":
    dependencies:
      react-router: ^6.30.6
      react-router-dom: ^6.30.6
  typescript@*:
    peerDependencies:
      vitest: "*"
  vitest@*:
    dependencies:
      "@types/node": "*"

plugins:
  - checksum: ae08ece83681cc6d217ebb53d9e00a06ea215383f34af0681a05da5720e018a6b0d98012112f9368e9fe2328b19919baba37ada25f46c4614b894765a9338db9
    path: .yarn/plugins/@yarnpkg/plugin-backstage.cjs
    spec: "https://versions.backstage.io/v1/releases/1.53.1/yarn-plugin"
